name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint
        if: runner.os == 'Linux'
        run: make lint
      - name: test (race)
        run: make race
      - name: build finc0 (static)
        run: make finc0
      - name: parse corpus
        run: make parse-corpus
      - name: finc0 vs finc1 differential
        run: make diff-parse
      - name: integration
        run: make integration
