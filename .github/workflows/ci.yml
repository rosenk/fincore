name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l $(git ls-files '*.go'))" || (gofmt -l $(git ls-files '*.go'); exit 1)
      - name: vet
        run: go vet ./...
      - name: test (race)
        run: go test -race -count=1 ./...
      - name: build finc0 (static)
        if: hashFiles('bootstrap/cmd/finc0/*.go') != ''
        env:
          CGO_ENABLED: "0"
        run: go build -trimpath -o bin/finc0 ./bootstrap/cmd/finc0
      - name: integration
        if: hashFiles('testdata/integration/*.go') != ''
        run: go test -count=1 -v ./testdata/integration/
