name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint
        run: make lint
      - name: unit tests
        run: make test
      - name: build finc0
        run: make finc0
      - name: corpus tests (native static ELF64)
        run: make test-corpus
      - name: examples (native static ELF64)
        run: make test-examples
      - name: integration (TCP echo + corpus)
        run: make integration
      - name: native self-hosting fixed point (finc1 -> finc2 == finc3)
        run: make bootstrap
