name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history + tags: the bootstrap needs the seed tag (bootstrap/SEED)
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: lint
        if: runner.os == 'Linux'
        run: make lint
      - name: test (race)
        run: make race
      - name: build finc0 (static)
        run: make finc0
      - name: parse corpus
        run: make parse-corpus
      - name: seed compiler (finc0 builds compiler/ at bootstrap/SEED)
        run: make seed
      # finc0 vs finc1: regression checks of the frozen v0.2 subset
      # (inputs marked // SINCE: v0.3+ are skipped).
      - name: finc0 vs finc1 differential
        run: make diff-parse
      - name: finc0 vs finc1 check differential
        run: make diff-check
      - name: finc0 vs finc1 scope differential
        run: make diff-check-scope
      - name: finc0 vs finc1 totality differential
        run: make diff-check-totality
      - name: finc0 vs finc1 full check differential
        run: make diff-check-all
      - name: finc0 vs finc1 codegen differential
        run: make diff-build
      - name: bootstrap fixed point (finc0 → finc-seed → finc1 → finc2 → finc3)
        run: make bootstrap
      - name: current compiler vs previous release (seed) regression
        run: make diff-prev
      - name: integration
        run: make integration
      - name: tooling (fmt idempotence + AST equivalence, --context golden tests)
        run: make fmt-fc-check context-test
