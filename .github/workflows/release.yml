# Release: build fincore-<version>-<os>-<arch>.tar.gz on every platform from
# a fresh bootstrap, smoke-test it, and publish a GitHub Release with the
# archives and SHA256SUMS. Layout and reproducibility: docs/release.md.
#
# A pushed tag v* releases itself. workflow_dispatch releases an existing tag
# (e.g. v0.2.0 retroactively): the sources come from the tag, the packaging
# tool (scripts/dist) from the commit the workflow runs on when the tag
# predates it.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v0.2.0)"
        required: true

permissions:
  contents: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: build ${{ matrix.goos }}/${{ matrix.goarch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, goos: linux, goarch: amd64, optional: false }
          - { os: ubuntu-24.04-arm, goos: linux, goarch: arm64, optional: false }
          - { os: macos-latest, goos: darwin, goarch: arm64, optional: false }
          # Intel macOS (macos-13 is retired); best effort.
          - { os: macos-15-intel, goos: darwin, goarch: amd64, optional: true }
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.optional }}
    steps:
      - name: check the tag name
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "bad tag: $TAG"; exit 1; }
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0 # full history + tags: the bootstrap needs the seed tag (bootstrap/SEED)
          path: src
      - uses: actions/checkout@v4 # packaging tool for tags that predate scripts/dist
        with:
          path: tools
      - uses: actions/setup-go@v5
        with:
          go-version-file: src/go.mod
          cache-dependency-path: src/go.mod
      - name: make bootstrap
        working-directory: src
        run: make bootstrap
      - name: make dist
        working-directory: src
        run: |
          if [ -d scripts/dist ]; then
            make dist VERSION="$TAG"
          else
            # The tag predates `make dist`: package its fresh finc2 with this
            # commit's tool (a launcher sets FINCROOT for old compilers).
            (cd ../tools && go run ./scripts/dist -version "$TAG" -finc ../src/.stage/finc2 -src ../src -out ../src/dist)
          fi
      - name: make dist-test
        working-directory: src
        run: |
          if [ -d scripts/dist ]; then
            make dist-test VERSION="$TAG"
          else
            (cd ../tools && go run ./scripts/dist -test -version "$TAG" -src ../src -out ../src/dist)
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: fincore-${{ matrix.goos }}-${{ matrix.goarch }}
          path: src/dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: check the tag name
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "bad tag: $TAG"; exit 1; }
      - uses: actions/checkout@v4 # CHANGELOG.md of the workflow's commit
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: fincore-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: dist
        run: |
          sha256sum fincore-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: release notes (CHANGELOG.md section, else the tag annotation)
        run: |
          # checkout may turn annotated tags into lightweight ones: refetch.
          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          if [ -f CHANGELOG.md ]; then
            awk -v tag="$TAG" '
              /^## / { if (on) exit; on = ($2 == tag || $2 == "[" tag "]") ; next }
              on' CHANGELOG.md > notes.md
          fi
          if [ ! -s notes.md ]; then
            git tag -l --format='%(contents)' "$TAG" > notes.md
          fi
          cat notes.md
      - name: create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          pre=()
          [[ "$TAG" == *-* ]] && pre=(--prerelease)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/fincore-*.tar.gz dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/fincore-*.tar.gz dist/SHA256SUMS \
              --verify-tag --title "FinCore $TAG" --notes-file notes.md "${pre[@]}"
          fi
